<text x="142" y="926" font-size="21" text-anchor="start" font-weight="400">实线：沿外轮廓剪下</text>
<line x1="455" y1="918" x2="520" y2="918" stroke="#152e50" stroke-width="2" stroke-dasharray="9 7"/>
<text x="536" y="926" font-size="21" text-anchor="start" font-weight="400">虚线：保留并折叠</text>
<text x="60" y="990" font-size="21" text-anchor="start" font-weight="400">把“上”当作屋顶，四个侧面向下折，最后合上“下”。</text>
<text x="60" y="1034" font-size="21" text-anchor="start" font-weight="400">先折出形状，需要固定时再用少量透明胶带。</text>
<text x="60" y="1117" font-size="18" text-anchor="start" font-weight="400">A4 等比例模板 · 打印选择“实际大小 / 100%”</text>
