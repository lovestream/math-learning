<text x="60" y="130" font-size="34" text-anchor="start" font-weight="700">长方体：找一找每个面</text>
<text x="60" y="174" font-size="22" text-anchor="start" font-weight="400">蓝色、黄色、红色各有一对；每一对的形状和大小相同。</text>
