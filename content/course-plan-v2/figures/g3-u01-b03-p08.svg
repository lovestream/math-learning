<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-u01-b03-p08-title g3-u01-b03-p08-desc"><title id="g3-u01-b03-p08-title">折回纸盒：相邻还是相对</title><desc id="g3-u01-b03-p08-desc">展开图竖列从上到下为1、3、5、6；2在3左侧，4在3右侧。六个同样正方形沿公共边连接。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">折回纸盒：相邻还是相对</text><rect x="300" y="65" width="75" height="75" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><text x="329" y="112" font-size="25" fill="#203c50">1</text><rect x="225" y="140" width="75" height="75" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><text x="254" y="187" font-size="25" fill="#203c50">2</text><rect x="300" y="140" width="75" height="75" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><text x="329" y="187" font-size="25" fill="#203c50">3</text><rect x="375" y="140" width="75" height="75" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><text x="404" y="187" font-size="25" fill="#203c50">4</text><rect x="300" y="215" width="75" height="75" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><text x="329" y="262" font-size="25" fill="#203c50">5</text><rect x="300" y="290" width="75" height="75" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><text x="329" y="337" font-size="25" fill="#203c50">6</text><text x="500" y="173" font-size="18" fill="#203c50">每格大小相同</text><text x="500" y="207" font-size="18" fill="#203c50">只沿公共边折叠</text><text x="28" y="401" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>