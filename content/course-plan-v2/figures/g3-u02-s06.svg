<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">两种文具，先换成同一种价格份</title><desc id="desc">4支记号笔各占1格价格，两支钢笔分别占3格价格；全部合计50元，每格同价。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">两种文具，先换成同一种价格份</text><text x="45" y="88" font-size="18" fill="#203c50">每一格代表一支记号笔的价格；不是物品个数。</text><rect x="80" y="115" width="50" height="40" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="143" y="115" width="50" height="40" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="206" y="115" width="50" height="40" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="269" y="115" width="50" height="40" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><text x="380" y="142" font-size="17" fill="#203c50">4支记号笔的总价</text><rect x="80" y="190" width="50" height="40" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="130" y="190" width="50" height="40" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="180" y="190" width="50" height="40" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="80" y="250" width="50" height="40" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="130" y="250" width="50" height="40" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="180" y="250" width="50" height="40" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><text x="260" y="217" font-size="17" fill="#203c50">1支钢笔的价格</text><text x="260" y="277" font-size="17" fill="#203c50">另1支钢笔的价格</text><text x="80" y="325" font-size="19" fill="#203c50">这些价格合起来是50元。</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>