<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">同一个数量，为什么出现一段缺口</title><desc id="desc">科普书4个等长份并排，从3份末端到绘本点有8本，从绘本点到4份末端有4本；绘本点在两者之间。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">同一个数量，为什么出现一段缺口</text><text x="42" y="79" font-size="17" fill="#203c50">每一格代表科普书的本数；下图先画出4份。</text><rect x="100" y="125" width="130" height="46" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="230" y="125" width="130" height="46" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="360" y="125" width="130" height="46" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="490" y="125" width="130" height="46" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><line x1="490" y1="209" x2="576.667" y2="209" stroke="#203c50" stroke-width="2" /><line x1="490" y1="204" x2="490" y2="214" stroke="#203c50" stroke-width="2" /><line x1="576.667" y1="204" x2="576.667" y2="214" stroke="#203c50" stroke-width="2" /><text x="503.33349999999996" y="199" font-size="16" fill="#203c50">多8本</text><line x1="576.667" y1="252" x2="620" y2="252" stroke="#203c50" stroke-width="2" /><line x1="576.667" y1="247" x2="576.667" y2="257" stroke="#203c50" stroke-width="2" /><line x1="620" y1="247" x2="620" y2="257" stroke="#203c50" stroke-width="2" /><text x="568.3335" y="242" font-size="16" fill="#203c50">少4本</text><line x1="576.667" y1="112" x2="576.667" y2="275" stroke="#ce7433" stroke-width="2" stroke-dasharray="5 4"/><text x="455" y="300" font-size="17" fill="#203c50">虚线处：绘本本数</text><text x="115" y="331" font-size="18" fill="#203c50">3份到绘本：8本；绘本到4份：4本。</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>