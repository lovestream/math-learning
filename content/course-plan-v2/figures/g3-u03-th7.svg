<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">同样两根纸条，为什么答案不同</title><desc id="desc">两根纸条各20厘米；图只展示材料，不给定接头位置或重叠长度。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">同样两根纸条，为什么答案不同</text><rect x="95" y="100" width="340" height="42" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><text x="205" y="128" font-size="18" fill="#203c50">20厘米</text><rect x="270" y="210" width="340" height="42" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><text x="380" y="238" font-size="18" fill="#203c50">20厘米</text><text x="70" y="300" font-size="18" fill="#203c50">这里只给出两根未搭接的纸条，请自己画两种搭法。</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>