<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">九宫格里不只九个正方形</title><desc id="desc">3行3列完整方格图，所有横竖边界线均画出；数边沿格线的所有正方形。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">九宫格里不只九个正方形</text><line x1="220" y1="80" x2="220" y2="320" stroke="#203c50" stroke-width="2" /><line x1="300" y1="80" x2="300" y2="320" stroke="#203c50" stroke-width="2" /><line x1="380" y1="80" x2="380" y2="320" stroke="#203c50" stroke-width="2" /><line x1="460" y1="80" x2="460" y2="320" stroke="#203c50" stroke-width="2" /><line x1="220" y1="80" x2="460" y2="80" stroke="#203c50" stroke-width="2" /><line x1="220" y1="160" x2="460" y2="160" stroke="#203c50" stroke-width="2" /><line x1="220" y1="240" x2="460" y2="240" stroke="#203c50" stroke-width="2" /><line x1="220" y1="320" x2="460" y2="320" stroke="#203c50" stroke-width="2" /><text x="505" y="193" font-size="18" fill="#203c50">不同大小都要数</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>