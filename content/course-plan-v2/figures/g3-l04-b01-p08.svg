<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-l04-b01-p08-title g3-l04-b01-p08-desc"><title id="g3-l04-b01-p08-title">整格与半格，怎样比较两张纸</title><desc id="g3-l04-b01-p08-desc">甲覆盖12整格，乙覆盖8整格及8个沿对角线切出的半格；所有原方格均为1平方厘米，乙的各部分不重叠。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">整格与半格，怎样比较两张纸</text><text x="50" y="85" font-size="18" fill="#203c50">每格都是1平方厘米；蓝色覆盖的是实际纸片面积。</text><text x="75" y="121" font-size="22" fill="#203c50">甲</text><text x="380" y="121" font-size="22" fill="#203c50">乙：各部分分开画</text><rect x="60" y="140" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="105" y="140" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="150" y="140" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="195" y="140" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="60" y="185" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="105" y="185" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="150" y="185" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="195" y="185" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="60" y="230" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="105" y="230" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="150" y="230" width="45" height="45" fill="#337cb0" fill-opacity=".28" stroke="#337cb0" stroke-width="2"/><rect x="195" y="230" width="45" height="45" fill="#337cb0" fill-opacity