<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-l05-b02-p06-title g3-l05-b02-p06-desc"><title id="g3-l05-b02-p06-title">同一张分组表，原始数据一定相同吗</title><desc id="g3-l05-b02-p06-desc">分组表只给出不足10分钟2人、10到19分钟3人、20分钟及以上1人，没有具体时长。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">同一张分组表，原始数据一定相同吗</text><text x="70" y="86" font-size="17" fill="#203c50">阅读时长均为整数分钟；表中没有保留每人的具体时长。</text><rect x="95" y="125" width="385" height="60" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><rect x="480" y="125" width="150" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="120" y="163" font-size="19" fill="#203c50">不足10分钟</text><text x="534" y="163" font-size="21" fill="#203c50">2人</text><rect x="95" y="190" width="385" height="60" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><rect x="480" y="190" width="150" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="120" y="228" font-size="19" fill="#203c50">10到19分钟</text><text x="534" y="228" font-size="21" fill="#203c50">3人</text><rect x="95" y="255" width="385" height="60" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><rect x="480" y="255" width="150" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="120" y="293" font-size="19" fill="#203c50">20分钟及以上</text><text x="534" y="293" font-size="21" fill="#203c50">1人</text><text x="100" y="357" font-size="19" fill="#203c50">请自己写出两组符合这张表的原始数据。</text><text x="28" y="401" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>