<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-up01-b02-p07-title g3-up01-b02-p07-desc"><title id="g3-up01-b02-p07-title">两次称量，多出来的是什么</title><desc id="g3-up01-b02-p07-desc">同一盒子加5球共170克，加2球共110克；盒子未变，所有球同重。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">两次称量，多出来的是什么</text><text x="70" y="85" font-size="19" fill="#203c50">两次使用同一个盒子；每个球一样重。</text><rect x="70" y="135" width="100" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="91" y="171" font-size="19" fill="#203c50">盒子</text><circle cx="220" cy="165" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><circle cx="285" cy="165" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><circle cx="350" cy="165" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><circle cx="415" cy="165" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><circle cx="480" cy="165" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><text x="585" y="173" font-size="22" fill="#203c50">共170克</text><rect x="70" y="255" width="100" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="91" y="291" font-size="19" fill="#203c50">盒子</text><circle cx="220" cy="285" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><circle cx="285" cy="285" r="23" fill="#e1edf7" stroke="#337cb0" stroke-width="2"/><text x="585" y="293" font-size="22" fill="#203c50">共110克</text><text x="28" y="401" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>