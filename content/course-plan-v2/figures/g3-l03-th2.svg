<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc"><title id="title">挖一个小缺口，周长为什么增加</title><desc id="desc">8×5厘米长方形，在上方8厘米边的中部剪去宽2厘米、深1厘米的矩形缺口；两侧角保留。</desc><rect width="800" height="410" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">挖一个小缺口，周长为什么增加</text><path d="M180 100 H360 V145 H460 V100 H640 V330 H180 Z" fill="#dceff0" stroke="#288878" stroke-width="3"/><line x1="180" y1="76" x2="640" y2="76" stroke="#203c50" stroke-width="2" /><line x1="180" y1="71" x2="180" y2="81" stroke="#203c50" stroke-width="2" /><line x1="640" y1="71" x2="640" y2="81" stroke="#203c50" stroke-width="2" /><text x="380.0" y="66" font-size="16" fill="#203c50">8厘米</text><text x="660" y="215" font-size="17" fill="#203c50">5厘米</text><line x1="360" y1="183" x2="460" y2="183" stroke="#203c50" stroke-width="2" /><line x1="360" y1="178" x2="360" y2="188" stroke="#203c50" stroke-width="2" /><line x1="460" y1="178" x2="460" y2="188" stroke="#203c50" stroke-width="2" /><text x="380.0" y="173" font-size="16" fill="#203c50">2厘米</text><text x="480" y="133" font-size="16" fill="#203c50">深1厘米</text><text x="28" y="390" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>