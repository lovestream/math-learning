<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="g3-l01-b01-p08-title g3-l01-b01-p08-desc"><title id="g3-l01-b01-p08-title">孔在折痕上，还是离开折痕</title><desc id="g3-l01-b01-p08-desc">两张分别对折的纸。左图在折痕边剪半圆，直径沿折痕；右图在远离折痕和纸边处打圆孔。均穿透两层，尚未展示展开结果。</desc><rect width="800" height="440" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">孔在折痕上，还是离开折痕</text><text x="48" y="85" font-size="18" fill="#203c50">对折后，两层一起剪；这里只画尚未展开的纸。</text><rect x="80" y="135" width="220" height="195" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><line x1="80" y1="130" x2="80" y2="335" stroke="#ca7030" stroke-width="2" stroke-dasharray="6 4"/><path d="M80 190 A45 45 0 0 1 80 280" fill="#fff" stroke="#ca7030" stroke-width="3"/><text x="93" y="365" font-size="17" fill="#203c50">半圆的直径在折痕上</text><rect x="440" y="135" width="220" height="195" fill="#337cb0" fill-opacity=".15" stroke="#337cb0" stroke-width="2"/><line x1="440" y1="130" x2="440" y2="335" stroke="#ca7030" stroke-width="2" stroke-dasharray="6 4"/><circle cx="550" cy="230" r="25" fill="#fff" stroke="#ca7030" stroke-width="3"/><text x="453" y="365" font-size="17" fill="#203c50">圆孔远离折痕与纸边</text><text x="83" y="120" font-size="16" fill="#203c50">折痕</text><text x="443" y="120" font-size="16" fill="#203c50">折痕</text><text x="28" y="421" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>