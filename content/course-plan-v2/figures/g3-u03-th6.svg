<svg xmlns="http://www.w3.org/2000/svg" width="800" height="465" viewBox="0 0 800 465" role="img" aria-labelledby="title desc"><title id="title">链环接长，为什么一处要看两段厚度</title><desc id="desc">4环拉紧的轴向投影；每环外长40毫米，端部厚5毫米，每处接头的重叠由两个5毫米端部相接组成。只与相邻环重叠，求链条外端总长。</desc><rect width="800" height="465" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">链环接长，为什么一处要看两段厚度</text><text x="30" y="72" font-size="18" fill="#203c50">沿拉伸方向的投影模型（不是链环立体画）</text><rect x="68" y="100" width="192" height="55" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="68" y="100" width="24" height="55" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="236" y="100" width="24" height="55" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><text x="120" y="135" font-size="16" fill="#203c50">环1</text><rect x="212" y="118" width="192" height="55" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="212" y="118" width="24" height="55" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><rect x="380" y="118" width="24" height="55" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><text x="264" y="153" font-size="16" fill="#203c50">环2</text><rect x="356" y="100" width="192" height="55" fill="#288878" fill-opacity=".18" stroke="#288878" stroke-width="2" rx="3"/><rect x="356" y="100" width="24" height="55" fill="#288878" fill-opacity=".18" stroke="#288878" stroke-width="2" rx="3"/><rect x="524" y="100" width="24" height="55" fill="#288878" fill-opacity=".18" stroke="#288878" stroke-width="2" rx="3"/><text x="408" y="135" font-size="16" fill="#203c50">环3</text><rect x="500" y="118" width="192" height="55" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="500" y="118" width="24" height="55" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="668" y="118" width="24" height="55" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><text x="552" y="153" font-size="16" fill="#203c50">环4</text><line x1="68" y1="206" x2="260" y2="206" stroke="#203c50" stroke-width="2" /><line x1="68" y1="201" x2="68" y2="211" stroke="#203c50" stroke-width="2" /><line x1="260" y1="201" x2="260" y2="211" stroke="#203c50" stroke-width="2" /><text x="134.0" y="196" font-size="16" fill="#203c50">外长4厘米</text><text x="38" y="250" font-size="18" fill="#203c50">一处接头的放大图：前后两个端部的长度接在一起</text><rect x="190" y="273" width="95" height="50" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><rect x="285" y="273" width="95" height="50" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><text x="202" y="306" font-size="16" fill="#203c50">前环端部</text><text x="298" y="306" font-size="16" fill="#203c50">后环端部</text><line x1="190" y1="355" x2="285" y2="355" stroke="#203c50" stroke-width="2" /><line x1="190" y1="350" x2="190" y2="360" stroke="#203c50" stroke-width="2" /><line x1="285" y1="350" x2="285" y2="360" stroke="#203c50" stroke-width="2" /><text x="207.5" y="345" font-size="16" fill="#203c50">5毫米</text><line x1="285" y1="355" x2="380" y2="355" stroke="#203c50" stroke-width="2" /><line x1="285" y1="350" x2="285" y2="360" stroke="#203c50" stroke-width="2" /><line x1="380" y1="350" x2="380" y2="360" stroke="#203c50" stroke-width="2" /><text x="302.5" y="345" font-size="16" fill="#203c50">5毫米</text><text x="425" y="310" font-size="18" fill="#203c50">这一处共重叠多少毫米？</text><text x="38" y="400" font-size="17" fill="#203c50">每个接头均为这一结构；两端未连接的部分不扣除。</text><text x="28" y="445" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>