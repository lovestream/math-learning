<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-u06-b02-p08-title g3-u06-b02-p08-desc"><title id="g3-u06-b02-p08-title">两次涂色，最后涂到了多少</title><desc id="g3-u06-b02-p08-desc">同一条八等份纸带：小乐涂1、2、3格，小明涂3、4、5格；两行是同一纸带的操作记录，不是两个整体。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">两次涂色，最后涂到了多少</text><text x="65" y="100" font-size="19" fill="#203c50">小乐涂的格</text><rect x="65" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0.3" stroke="#337cb0" stroke-width="2"/><text x="98" y="154" font-size="18" fill="#203c50">1</text><rect x="145" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0.3" stroke="#337cb0" stroke-width="2"/><text x="178" y="154" font-size="18" fill="#203c50">2</text><rect x="225" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0.3" stroke="#337cb0" stroke-width="2"/><text x="258" y="154" font-size="18" fill="#203c50">3</text><rect x="305" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="338" y="154" font-size="18" fill="#203c50">4</text><rect x="385" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="418" y="154" font-size="18" fill="#203c50">5</text><rect x="465" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="498" y="154" font-size="18" fill="#203c50">6</text><rect x="545" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="578" y="154" font-size="18" fill="#203c50">7</text><rect x="625" y="120" width="80" height="55" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="658" y="154" font-size="18" fill="#203c50">8</text><text x="65" y="230" font-size="19" fill="#203c50">小明涂的格</text><rect x="65" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="98" y="284" font-size="18" fill="#203c50">1</text><rect x="145" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="178" y="284" font-size="18" fill="#203c50">2</text><rect x="225" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0.3" stroke="#ca7030" stroke-width="2"/><text x="258" y="284" font-size="18" fill="#203c50">3</text><rect x="305" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0.3" stroke="#ca7030" stroke-width="2"/><text x="338" y="284" font-size="18" fill="#203c50">4</text><rect x="385" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0.3" stroke="#ca7030" stroke-width="2"/><text x="418" y="284" font-size="18" fill="#203c50">5</text><rect x="465" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="498" y="284" font-size="18" fill="#203c50">6</text><rect x="545" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="578" y="284" font-size="18" fill="#203c50">7</text><rect x="625" y="250" width="80" height="55" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="658" y="284" font-size="18" fill="#203c50">8</text><text x="65" y="350" font-size="18" fill="#203c50">上下表示同一条纸带的两次涂色；把重合位置找出来。</text><text x="28" y="401" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>