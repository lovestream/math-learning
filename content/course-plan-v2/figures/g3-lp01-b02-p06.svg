<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-lp01-b02-p06-title g3-lp01-b02-p06-desc"><title id="g3-lp01-b02-p06-title">最早几点能到图书馆</title><desc id="g3-lp01-b02-p06-desc">13:40从家出发，步行25分钟到站；班次14:00和14:20；上车后15分钟到图书馆。到站、等车和到馆时刻未填答案。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">最早几点能到图书馆</text><text x="45" y="85" font-size="18" fill="#203c50">班次表：14:00、14:20发车；错过一班就等下一班。</text><rect x="85" y="135" width="110" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="105" y="173" font-size="19" fill="#203c50">家</text><rect x="330" y="135" width="110" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="350" y="173" font-size="19" fill="#203c50">公交站</text><rect x="630" y="135" width="110" height="60" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><text x="650" y="173" font-size="19" fill="#203c50">图书馆</text><line x1="197" y1="163" x2="323" y2="163" stroke="#337cb0" stroke-width="2" stroke-dasharray=""/><text x="217" y="134" font-size="15" fill="#203c50">步行25分钟</text><line x1="442" y1="163" x2="622" y2="163" stroke="#337cb0" stroke-width="2" stroke-dasharray=""/><text x="466" y="134" font-size="16" fill="#203c50">乘车15分钟</text><text x="60" y="240" font-size="20" fill="#203c50">13:40出发</text><text x="300" y="240" font-size="20" fill="#203c50">几点到站？</text><text x="590" y="240" font-size="20" fill="#203c50">最早几点到？</text><text x="275" y="314" font-size="19" fill="#203c50">到站后有没有一段等待？</text><text x="28" y="401" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>