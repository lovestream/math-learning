<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">两块木板接起来，哪一段算重了</title><desc id="desc">甲板从共同起点向右长30厘米。乙板从甲右端左移8厘米处起，长25厘米；两板在8厘米投影段重叠，求覆盖总长。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">两块木板接起来，哪一段算重了</text><rect x="85" y="110" width="360" height="44" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><text x="95" y="139" font-size="18" fill="#203c50">甲：30厘米</text><rect x="349" y="177" width="300" height="44" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><text x="455" y="206" font-size="18" fill="#203c50">乙：25厘米</text><line x1="349" y1="100" x2="349" y2="254" stroke="#ce7433" stroke-width="2" stroke-dasharray="5 4"/><line x1="445" y1="100" x2="445" y2="254" stroke="#ce7433" stroke-width="2" stroke-dasharray="5 4"/><line x1="349" y1="255" x2="445" y2="255" stroke="#203c50" stroke-width="2" /><line x1="349" y1="250" x2="349" y2="260" stroke="#203c50" stroke-width="2" /><line x1="445" y1="250" x2="445" y2="260" stroke="#203c50" stroke-width="2" /><text x="367.0" y="245" font-size="16" fill="#203c50">8厘米</text><line x1="85" y1="306" x2="649" y2="306" stroke="#203c50" stroke-width="2" /><line x1="85" y1="301" x2="85" y2="311" stroke="#203c50" stroke-width="2" /><line x1="649" y1="301" x2="649" y2="311" stroke="#203c50" stroke-width="2" /><text x="337.0" y="296" font-size="16" fill="#203c50">总长？</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>