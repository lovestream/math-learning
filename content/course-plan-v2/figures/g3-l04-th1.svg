<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc"><title id="title">沿对角线剪开，面积怎么办</title><desc id="desc">长6厘米、宽4厘米的长方形，从左下到右上画一条对角线，拟沿线剪开。</desc><rect width="800" height="410" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">沿对角线剪开，面积怎么办</text><rect x="200" y="105" width="360" height="240" fill="#288878" fill-opacity=".18" stroke="#288878" stroke-width="2" rx="3"/><line x1="200" y1="345" x2="560" y2="105" stroke="#ce7433" stroke-width="2" /><line x1="200" y1="78" x2="560" y2="78" stroke="#203c50" stroke-width="2" /><line x1="200" y1="73" x2="200" y2="83" stroke="#203c50" stroke-width="2" /><line x1="560" y1="73" x2="560" y2="83" stroke="#203c50" stroke-width="2" /><text x="350.0" y="68" font-size="16" fill="#203c50">6厘米</text><text x="585" y="230" font-size="18" fill="#203c50">4厘米</text><text x="28" y="390" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>