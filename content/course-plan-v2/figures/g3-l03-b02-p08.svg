<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="g3-l03-b02-p08-title g3-l03-b02-p08-desc"><title id="g3-l03-b02-p08-title">菜地哪一边靠墙更省围栏</title><desc id="g3-l03-b02-p08-desc">同一8米×5米菜地：左图8米边贴墙，右图旋转摆放使5米边贴墙。靠墙边不围，其余三边都围。</desc><rect width="800" height="460" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">菜地哪一边靠墙更省围栏</text><text x="50" y="83" font-size="18" fill="#203c50">选不同的一边贴墙；只围另外三边。</text><rect x="85" y="150" width="240" height="150" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><line x1="70" y1="140" x2="340" y2="140" stroke="#ca7030" stroke-width="2" stroke-dasharray=""/><text x="140" y="125" font-size="19" fill="#203c50">墙 / 8米边</text><text x="332" y="236" font-size="17" fill="#203c50">5米</text><rect x="490" y="150" width="150" height="240" fill="#238775" fill-opacity=".15" stroke="#238775" stroke-width="2"/><line x1="475" y1="140" x2="655" y2="140" stroke="#ca7030" stroke-width="2" stroke-dasharray=""/><text x="496" y="125" font-size="19" fill="#203c50">墙 / 5米边</text><text x="655" y="270" font-size="17" fill="#203c50">8米</text><text x="28" y="441" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>