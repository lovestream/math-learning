<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="g3-l04-b03-p08-title g3-l04-b03-p08-desc"><title id="g3-l04-b03-p08-title">剪掉一个角，面积和周长怎样变</title><desc id="g3-l04-b03-p08-desc">8×5厘米长方形左上角剪去3×2厘米小长方形，剪去的两条边沿原长方形两条边；橙线标出剪去的原边，绿线表示剩余形状。</desc><rect width="800" height="440" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">剪掉一个角，面积和周长怎样变</text><rect x="130" y="110" width="400" height="250" fill="#238775" fill-opacity="0" stroke="#238775" stroke-width="2"/><rect x="130" y="110" width="150" height="100" fill="#ca7030" fill-opacity="0.15" stroke="#ca7030" stroke-width="2"/><path d="M280 110 H530 V360 H130 V210 H280 Z" fill="#dcefee" stroke="#238775" stroke-width="3"/><text x="270" y="89" font-size="19" fill="#203c50">原长8厘米</text><text x="545" y="245" font-size="17" fill="#203c50">原宽5厘米</text><text x="165" y="155" font-size="19" fill="#203c50">剪去3×2</text><text x="162" y="185" font-size="17" fill="#203c50">厘米的小块</text><line x1="130" y1="110" x2="280" y2="110" stroke="#ca7030" stroke-width="2" stroke-dasharray="5 4"/><line x1="130" y1="110" x2="130" y2="210" stroke="#ca7030" stroke-width="2" stroke-dasharray="5 4"/><text x="28" y="421" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>