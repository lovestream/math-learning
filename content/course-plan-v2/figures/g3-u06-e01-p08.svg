<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="g3-u06-e01-p08-title g3-u06-e01-p08-desc"><title id="g3-u06-e01-p08-title">合并小格后，涂色部分怎样表示</title><desc id="g3-u06-e01-p08-desc">纸带六等份，第1和3格涂蓝。每相邻两小格合为一个大格，橙框为1–2、3–4、5–6，涂色边界不动。</desc><rect width="800" height="420" fill="#f8fbfc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">合并小格后，涂色部分怎样表示</text><rect x="85" y="155" width="100" height="80" fill="#337cb0" fill-opacity="0.35" stroke="#337cb0" stroke-width="2"/><text x="126" y="203" font-size="20" fill="#203c50">1</text><rect x="185" y="155" width="100" height="80" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="226" y="203" font-size="20" fill="#203c50">2</text><rect x="285" y="155" width="100" height="80" fill="#337cb0" fill-opacity="0.35" stroke="#337cb0" stroke-width="2"/><text x="326" y="203" font-size="20" fill="#203c50">3</text><rect x="385" y="155" width="100" height="80" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="426" y="203" font-size="20" fill="#203c50">4</text><rect x="485" y="155" width="100" height="80" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="526" y="203" font-size="20" fill="#203c50">5</text><rect x="585" y="155" width="100" height="80" fill="#337cb0" fill-opacity="0" stroke="#337cb0" stroke-width="2"/><text x="626" y="203" font-size="20" fill="#203c50">6</text><rect x="85" y="148" width="200" height="94" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="112" y="119" font-size="18" fill="#203c50">第1大格</text><rect x="285" y="148" width="200" height="94" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="312" y="119" font-size="18" fill="#203c50">第2大格</text><rect x="485" y="148" width="200" height="94" fill="#ca7030" fill-opacity="0" stroke="#ca7030" stroke-width="2"/><text x="512" y="119" font-size="18" fill="#203c50">第3大格</text><text x="85" y="295" font-size="18" fill="#203c50">蓝色只在第1、3小格；橙框每两小格合为一大格。</text><text x="28" y="401" font-size="14" fill="#203c50">按题目条件和标注推理；示意图不可当实物尺测量。</text></g></svg>