<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">四条射线能组成几个角</title><desc id="desc">顶点O出发四条不同射线按A、B、C、D顺序排列，全部在小于直角的扇形内；数任取两条夹出的较小角。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">四条射线能组成几个角</text><text x="45" y="85" font-size="17" fill="#203c50">同一个顶点，四条不同射线都在小于直角的范围内。</text><line x1="170" y1="310" x2="645" y2="285" stroke="#377db4" stroke-width="2" /><text x="655" y="285" font-size="20" fill="#203c50">A</text><line x1="170" y1="310" x2="625" y2="230" stroke="#377db4" stroke-width="2" /><text x="635" y="230" font-size="20" fill="#203c50">B</text><line x1="170" y1="310" x2="580" y2="155" stroke="#377db4" stroke-width="2" /><text x="590" y="155" font-size="20" fill="#203c50">C</text><line x1="170" y1="310" x2="505" y2="80" stroke="#377db4" stroke-width="2" /><text x="515" y="80" font-size="20" fill="#203c50">D</text><text x="145" y="336" font-size="19" fill="#203c50">O</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>