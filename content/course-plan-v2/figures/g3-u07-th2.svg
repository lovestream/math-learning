<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">最短路线怎样列全</title><desc id="desc">2行2列格路，起点左下，终点右上；只沿格线向右或向上，每次一格。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">最短路线怎样列全</text><line x1="240" y1="90" x2="240" y2="310" stroke="#203c50" stroke-width="2" /><line x1="350" y1="90" x2="350" y2="310" stroke="#203c50" stroke-width="2" /><line x1="460" y1="90" x2="460" y2="310" stroke="#203c50" stroke-width="2" /><line x1="240" y1="90" x2="460" y2="90" stroke="#203c50" stroke-width="2" /><line x1="240" y1="200" x2="460" y2="200" stroke="#203c50" stroke-width="2" /><line x1="240" y1="310" x2="460" y2="310" stroke="#203c50" stroke-width="2" /><text x="165" y="326" font-size="18" fill="#203c50">起点</text><text x="475" y="100" font-size="18" fill="#203c50">终点</text><text x="540" y="185" font-size="18" fill="#203c50">只向右或向上</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>