<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">来回传球，一个周期不是六次</title><desc id="desc">六人直线站位从左到右1至6，球从1依次到6再依次回1，每次只传给相邻一人，端点立即反向。</desc><rect width="800" height="380" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">来回传球，一个周期不是六次</text><text x="42" y="86" font-size="18" fill="#203c50">开始：球在1号；开始持球不计接球次数。</text><circle cx="95" cy="165" r="30" fill="#e6f1f7" stroke="#377db4"/><text x="85" y="172" font-size="21" fill="#203c50">1</text><circle cx="210" cy="165" r="30" fill="#e6f1f7" stroke="#377db4"/><text x="200" y="172" font-size="21" fill="#203c50">2</text><circle cx="325" cy="165" r="30" fill="#e6f1f7" stroke="#377db4"/><text x="315" y="172" font-size="21" fill="#203c50">3</text><circle cx="440" cy="165" r="30" fill="#e6f1f7" stroke="#377db4"/><text x="430" y="172" font-size="21" fill="#203c50">4</text><circle cx="555" cy="165" r="30" fill="#e6f1f7" stroke="#377db4"/><text x="545" y="172" font-size="21" fill="#203c50">5</text><circle cx="670" cy="165" r="30" fill="#e6f1f7" stroke="#377db4"/><text x="660" y="172" font-size="21" fill="#203c50">6</text><line x1="95" y1="228" x2="670" y2="228" stroke="#377db4" stroke-width="2" /><text x="330" y="218" font-size="19" fill="#203c50">先向右传 →</text><line x1="670" y1="294" x2="95" y2="294" stroke="#ce7433" stroke-width="2" /><text x="330" y="283" font-size="19" fill="#203c50">← 再向左传</text><text x="28" y="360" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>