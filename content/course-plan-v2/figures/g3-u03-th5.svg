<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">总长知道了，接头盖住多少</title><desc id="desc">三板各30厘米，两处相等搭接，没有三重重叠，端到端78厘米，求每处重叠。</desc><rect width="800" height="400" fill="#f8fbfc"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="35" font-size="23" fill="#203c50">总长知道了，接头盖住多少</text><rect x="70" y="88" width="240" height="35" fill="#377db4" fill-opacity=".18" stroke="#377db4" stroke-width="2" rx="3"/><text x="125" y="113" font-size="16" fill="#203c50">30厘米</text><rect x="262" y="143" width="240" height="35" fill="#ce7433" fill-opacity=".18" stroke="#ce7433" stroke-width="2" rx="3"/><text x="317" y="168" font-size="16" fill="#203c50">30厘米</text><rect x="454" y="198" width="240" height="35" fill="#288878" fill-opacity=".18" stroke="#288878" stroke-width="2" rx="3"/><text x="509" y="223" font-size="16" fill="#203c50">30厘米</text><line x1="262" y1="140" x2="310" y2="140" stroke="#203c50" stroke-width="2" /><line x1="262" y1="135" x2="262" y2="145" stroke="#203c50" stroke-width="2" /><line x1="310" y1="135" x2="310" y2="145" stroke="#203c50" stroke-width="2" /><text x="256.0" y="130" font-size="16" fill="#203c50">？厘米</text><line x1="454" y1="195" x2="502" y2="195" stroke="#203c50" stroke-width="2" /><line x1="454" y1="190" x2="454" y2="200" stroke="#203c50" stroke-width="2" /><line x1="502" y1="190" x2="502" y2="200" stroke="#203c50" stroke-width="2" /><text x="448.0" y="185" font-size="16" fill="#203c50">？厘米</text><line x1="70" y1="291" x2="694" y2="291" stroke="#203c50" stroke-width="2" /><line x1="70" y1="286" x2="70" y2="296" stroke="#203c50" stroke-width="2" /><line x1="694" y1="286" x2="694" y2="296" stroke="#203c50" stroke-width="2" /><text x="352.0" y="281" font-size="16" fill="#203c50">78厘米</text><text x="85" y="334" font-size="17" fill="#203c50">两个接头重叠得一样长；没有三块同时重叠。</text><text x="28" y="380" font-size="14" fill="#5d7180">示意图；按标注推理，不测量屏幕。</text></g></svg>